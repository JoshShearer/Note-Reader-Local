name: Release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run quality gates
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Generate checksums
        id: hash
        run: |
          cd dist || true
          if [ -f main.js ] && [ -f manifest.json ]; then
            sha256sum main.js manifest.json styles.css 2>/dev/null | base64 -w0 > checksums.txt
            echo "hashes=$(cat checksums.txt)" >> $GITHUB_OUTPUT
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            main.js
            manifest.json
            styles.css
            ort/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            main.js
            manifest.json
            styles.css
            ort/ort-wasm-simd-threaded.mjs
            ort/ort-wasm-simd-threaded.wasm
            ort/ort-wasm-simd-threaded.jsep.mjs
            ort/ort-wasm-simd-threaded.jsep.wasm

  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3@v2.0.0
        with:
          base64-subjects: ${{ needs.build.outputs.hashes }}
          upload-assets: true
