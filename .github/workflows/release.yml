name: Release

on:
  push:
    # NRL-75. This was `- "*"`, which cut a real, public GitHub Release
    # (the release-upload step below, `softprops/action-gh-release`) on ANY tag
    # whose name holds no `/`: `nightly`, `wip`, `pre-rebase`, `v0.1.0`,
    # `0.1.0-rc1`. A `backup/`-shaped tag was inert only because of the slash.
    #
    # THESE ARE GITHUB FILTER PATTERNS, NOT REGEXES, and the two look alike
    # while behaving differently. `*` is a wildcard - "zero or more characters,
    # but does not match the `/` character" - and NOT a quantifier over what
    # precedes it, so `[0-9]*.[0-9]*.[0-9]*` would read as "one digit then any
    # non-slash run" and would fire on `0.1.0-rc1`. `+` IS the quantifier:
    # "matches one or more of the preceding character". GitHub's own published
    # table applies it to a preceding BRACKET CLASS - the row
    # `v[12].[0-9]+.[0-9]+` is documented as matching `v1.10.1` and `v2.0.0`,
    # and that two-digit minor is what proves `[0-9]+` means one-or-more digits
    # rather than one. Read verbatim during NRL-75 from github/docs@main,
    # content/actions/reference/workflows-and-actions/workflow-syntax.md.
    #
    # The double quotes are required, not style: the same docs say a pattern
    # starting with `[` must be quoted or YAML fails to parse the workflow.
    #
    # Prereleases are excluded deliberately. `prerelease: false` is hardcoded in
    # the release-upload step below and versions.json holds no
    # prerelease key, so a matching `0.1.0-rc1` would cut a Release that claims
    # to be stable.
    #
    # No `v` prefix, because nothing here uses one: manifest.json's version is
    # `0.1.0` and versions.json's sole key is `"0.1.0"` (both measured during
    # NRL-75), so a `v*.*.*` pattern would simply never fire.
    #
    # `tags-ignore` is not an option beside this - the docs say you cannot use
    # both `tags` and `tags-ignore` for the same event - and a `!` negation
    # entry was rejected as redundant next to an all-digits-and-dots positive
    # pattern, and as making the file read safer than the pattern really is.
    #
    # DESK-VERIFIED FROM THE DOCS ONLY. No tag has ever been pushed to this
    # repo, so it is not observed that `0.1.0` fires this workflow or that
    # `nightly` no longer does. NRL-79 owns that empirical half.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # NRL-105. Obsidian's community-plugin installer reads `manifest.json` off
      # the Release to learn the plugin's version, and `versions.json` to decide
      # which Obsidian versions may install it. NRL-75 narrowed the tag trigger
      # to bare semver, but it admits ANY bare semver: pushing `9.9.9` at a
      # commit whose manifest says `0.1.0` would cut a Release whose name and
      # contents contradict each other. This is the one hazard on this path that
      # reaches a user rather than only CI.
      #
      # It FAILS and never rewrites a file. A workflow that edits the version it
      # is releasing is a worse failure mode than a stopped release: the tag, the
      # reviewed commit and the signed attestation would then describe three
      # different things.
      #
      # Every disagreement is reported, not the first. A tag is expensive to
      # retry - delete it locally and remotely, and every attempt leaves a
      # permanent run in Actions history - so stopping at the first mismatch
      # would mean three push-fail-delete cycles for one half-finished bump.
      #
      # The tag arrives through `env:` and is read as "$TAG". That is the
      # documented script-injection-safe shape, and it is also what makes the
      # body testable: tests/release.test.ts extracts this block VERBATIM, so a
      # GitHub expression written inside it would survive as an unevaluable
      # literal and the extracted script could never be exercised.
      #
      # node, not jq: the Setup Node.js step above puts node on PATH, and the
      # test harness guarantees node where it does not guarantee jq.
      #
      # `set -euo pipefail` is in the BODY, not in `shell:` - ADR 0011's NRL-76
      # amendment, decision 4. The body is what the suite executes; a
      # harness-level flag would be a guarantee no test covers.
      #
      # No `if:` on this step, deliberately. `on:` is `push.tags` only, so
      # `github.ref_name` is always the pushed tag; and per the same amendment's
      # decision 5, a condition that can silently skip is worse than a failure.
      - name: Verify the tag matches the version files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "NRL-105: TAG is empty or unset. This step must receive github.ref_name; refusing to build a Release whose version nothing checked." >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const tag = process.env.TAG;
            const problems = [];
            const isObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
            // The sentinel is `undefined` and NOT `null`: `JSON.parse` can return
            // `null`, so a `null` sentinel made a versions.json whose whole content
            // is the literal `null` skip every check and exit 0. Measured.
            const load = (file) => {
              let raw;
              try {
                raw = fs.readFileSync(file, "utf-8");
              } catch {
                problems.push(file + ": missing or unreadable in the checkout root");
                return undefined;
              }
              try {
                return JSON.parse(raw);
              } catch (err) {
                problems.push(file + ": not valid JSON (" + err.message + ")");
                return undefined;
              }
            };
            const checkVersionField = (file, parsed) => {
              if (parsed === undefined) return;
              if (!isObject(parsed)) {
                problems.push(file + ": not a JSON object, so it carries no version field");
                return;
              }
              if (parsed.version !== tag) {
                problems.push(file + " version is " + JSON.stringify(parsed.version) + ", tag is " + JSON.stringify(tag));
              }
            };
            checkVersionField("manifest.json", load("manifest.json"));
            checkVersionField("package.json", load("package.json"));
            const versions = load("versions.json");
            if (versions !== undefined) {
              if (!isObject(versions)) {
                problems.push("versions.json: not a JSON object mapping plugin version to minimum Obsidian version");
              } else if (!Object.prototype.hasOwnProperty.call(versions, tag)) {
                problems.push("versions.json has no key " + JSON.stringify(tag) + "; its keys are " + JSON.stringify(Object.keys(versions)));
              } else if (typeof versions[tag] !== "string" || versions[tag] === "") {
                problems.push("versions.json[" + JSON.stringify(tag) + "] is " + JSON.stringify(versions[tag]) + ", which must be a non-empty minimum Obsidian version string");
              }
            }
            if (problems.length > 0) {
              console.error("NRL-105: the pushed tag does not agree with the version files. Obsidian reads manifest.json and versions.json off the Release, so this run would publish a Release whose name and contents contradict each other. Every disagreement found:");
              for (const problem of problems) console.error("  - " + problem);
              console.error("Fix the files and push a new tag. This step never rewrites them.");
              process.exit(1);
            }
            console.log("tag " + tag + " agrees with manifest.json, package.json and versions.json");
          '

      # Build strictly before test: tests/release.test.ts asserts main.js
      # exists and carries the packed ORT runtime, so on a fresh checkout it
      # fails for that reason alone. This step used to run typecheck, test,
      # build in that order.
      #
      # NRL_SKIP_REAL_SPEECHD bypasses the two regions of tests/engine.test.ts
      # that need a running speech-dispatcher daemon and an audio sink. This
      # runner is the same stock ubuntu-latest image the CI workflow uses and
      # has neither, so without the variable the reorder above would only move
      # where a tag build dies.
      - name: Run quality gates
        run: |
          npm run typecheck
          npm run build
          npm test
        env:
          NRL_SKIP_REAL_SPEECHD: "1"

      # NRL-76, amended by NRL-96/ADR 0028. This step feeds
      # `needs.build.outputs.hashes` into the SLSA generator's
      # `base64-subjects`, so everything it gets wrong becomes a signed
      # attestation over the wrong bytes rather than a failed run.
      #
      # `cd dist || true`: there is no `dist/` in this repo - `npm run build`
      # writes `main.js` to the REPO ROOT and deploy.mjs reads from the root -
      # so the `cd` always failed, `|| true` swallowed it, and the step stayed
      # in the root and found the right files BY ACCIDENT. Measured in a
      # sandbox during NRL-76: with a `dist/` present holding different bytes
      # under the same names, the attested `main.js` digest was the dist
      # copy's (`e32e168f...`) and not the root's (`79a8a4a7...`). A directory
      # created by any future build step, cache restore or action would
      # therefore capture the attestation silently.
      #
      # `set -euo pipefail` is in the BODY rather than via `shell: bash`,
      # because the body is what tests/release.test.ts extracts and executes;
      # a harness-level flag would be a guarantee no test covers. GitHub's
      # documented default for a `run:` is fail-fast via `set -e` ALONE, with
      # `-o pipefail` added only when `shell: bash` is written explicitly
      # (github/docs@main workflow-syntax.md) - and that absence is exactly why
      # a failing `sha256sum` on the left of `| base64` could not fail the step.
      #
      # ALL THREE published assets are subjects, matching `Upload Release
      # Assets` below. NRL-76 originally attested all seven build outputs,
      # including the four ORT runtime files, because those were the bytes a
      # user downloaded at runtime (R-M01 clause 3, ADR 0024) and attesting 3
      # of 7 left the two largest downloadables with no subject at all. ADR
      # 0028 (NRL-96) removed that download entirely - the runtime is packed
      # inside `main.js` now, so `npm run build` no longer produces an `ort/`
      # directory at all, and there is nothing left to hash separately. The
      # runtime's own integrity is verified by `main.js`'s attested digest
      # covering it, and independently by `tests/release.test.ts` comparing the
      # packed bytes against `node_modules/onnxruntime-web/dist` at build time.
      #
      # The non-empty guard lives HERE and nowhere else. Do not add
      # `if: needs.build.outputs.hashes != ''` to the `provenance` job: a
      # failing step already stops it through `needs: build`, whereas an `if:`
      # would SKIP provenance silently and produce a green run with no
      # attestation - the same silence this step is being cleaned of.
      #
      # DESK-VERIFIED. Every number above is a local bash execution of this
      # body; no tag has ever been pushed, so this step has never run on a
      # runner. NRL-79 owns that half.
      - name: Generate checksums
        id: hash
        run: |
          set -euo pipefail
          HASHES=$(sha256sum \
            main.js \
            manifest.json \
            styles.css \
            | base64 -w0)
          if [ -z "$HASHES" ]; then
            echo "Generate checksums produced an empty subject list; refusing to hand the SLSA generator an empty base64-subjects" >&2
            exit 1
          fi
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            main.js
            manifest.json
            styles.css

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      # Exactly the three files Obsidian's own installer fetches, and nothing
      # else. The four ort/ assets used to be published here so the plugin
      # could fetch its runtime from a release URL; they do not any more,
      # because that is executable dependency management and the
      # community-plugin policies prohibit it (ADR 0028). The runtime now
      # ships inside main.js. Publishing them anyway would leave a
      # downloadable copy of executable code that nothing installs and that a
      # future reader would reasonably assume is load-bearing.
      #
      # ONE action creates the Release and uploads the assets, as of NRL-104.
      # A `Create GitHub Release` step (`actions/create-release@v1`) used to run
      # immediately above this one; it was the sole source of the three `The
      # set-output command is deprecated and will be disabled soon` warnings
      # NRL-79's run 36785920227 recorded, the only `using: node12` runtime in
      # the file, and the `tag_name: ${{ github.ref }}` shape that handed the
      # full `refs/tags/0.1.1` to a step whose adjacent line used the bare
      # `github.ref_name`. No `tag_name:` here on purpose: this action defaults
      # its tag to `github.ref`, so naming it would put that shape straight back.
      #
      # Pinned by COMMIT, not by tag, and the comment is what keeps the pin
      # readable. `efb35369...` is `v3.0.3` - the annotated tag `v3.0.3` is
      # `e598afbe...`, which dereferences to this commit, tagged 2026-08-30, and
      # that tree's `action.yml` declares `using: "node24"`. `v1` was NOT chosen:
      # its tag has not moved since 2022-11-21 and declares `using: "node16"`,
      # which is deprecated too, so pinning it would have left the ticket's
      # runtime goal half done. The `set-output` deprecation dies with the
      # DELETION above rather than with this version choice - both softprops
      # dists hold zero literal `::set-output`.
      #
      # `fail_on_unmatched_files: true` is not optional. The action documents it
      # as defaulting to FALSE, so without it a missing `main.js` publishes a
      # Release carrying fewer assets than the attestation covers and still
      # concludes success - the silent-truncation shape NRL-76 removed from
      # `Generate checksums` (ADR 0011, NRL-76 decisions 4 and 5).
      #
      # THE BLOCK SCALAR BELOW MUST STAY LAST, with the blank line after it. Its
      # reader is `extractUploadedFiles` in `tests/release.test.ts`, a regex over
      # this text rather than a YAML parse, and it ends its capture at the first
      # BLANK LINE and not at the next YAML key - so any `with:` key written under
      # that scalar is read as a published asset and breaks the NRL-76 subject-set
      # equality check. The step NAME matters for the same reason: the regex
      # anchors on it. SO DOES THE PROSE ABOVE IT, measured while writing this
      # comment: the regex takes the FIRST occurrence of its two anchors anywhere
      # in the file, so a comment up here quoting either of them verbatim hijacks
      # the capture and the NRL-76 check reports the comment as a published asset.
      # That is why this paragraph names neither literally and why the pre-existing
      # comment near `Generate checksums` splits the step name across two lines.
      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css

  # NRL-69: the SLSA generator is a REUSABLE WORKFLOW, so it has to be called
  # at job level via `jobs.<id>.uses:`. It used to be a step's `uses:`, which
  # cannot resolve a workflow path. A job with a job-level `uses:` may not carry
  # `runs-on:` or `steps:`, so both are gone; the generator works from the
  # base64 subjects alone, so the artifact download was never needed.
  #
  # The `.yml` on the end is load-bearing and is the second half of the same
  # defect. A reusable-workflow reference is `owner/repo/path/to/file.yml@ref`
  # and the extension is required; without it the ref does not resolve and the
  # whole FILE fails to compile, which is why every run in this repo's history
  # was a 0-second, 0-job failure with no log, on branch pushes that
  # `on: push: tags` should never have matched at all. Both halves were needed:
  # measured on GitHub within six minutes on 2026-09-30, the job-level call
  # without `.yml` still produced run 36677235986 (0 jobs, created_at ==
  # updated_at), removing the job entirely produced no run, and restoring it
  # with `.yml` produced no run.
  #
  # `needs: build` is kept so `needs.build.outputs.hashes` still resolves.
  # All three permissions are required by the generator's own jobs: it reads
  # workflow metadata, signs the provenance, and uploads the release asset.
  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
