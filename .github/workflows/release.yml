name: Release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build strictly before test: tests/release.test.ts asserts main.js and
      # ort/ exist, so on a fresh checkout it fails for that reason alone. This
      # step used to run typecheck, test, build in that order.
      #
      # NRL_SKIP_REAL_SPEECHD bypasses the two regions of tests/engine.test.ts
      # that need a running speech-dispatcher daemon and an audio sink. This
      # runner is the same stock ubuntu-latest image the CI workflow uses and
      # has neither, so without the variable the reorder above would only move
      # where a tag build dies.
      - name: Run quality gates
        run: |
          npm run typecheck
          npm run build
          npm test
        env:
          NRL_SKIP_REAL_SPEECHD: "1"

      - name: Generate checksums
        id: hash
        run: |
          cd dist || true
          if [ -f main.js ] && [ -f manifest.json ]; then
            sha256sum main.js manifest.json styles.css 2>/dev/null | base64 -w0 > checksums.txt
            echo "hashes=$(cat checksums.txt)" >> $GITHUB_OUTPUT
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            main.js
            manifest.json
            styles.css
            ort/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            main.js
            manifest.json
            styles.css
            ort/ort-wasm-simd-threaded.mjs
            ort/ort-wasm-simd-threaded.wasm
            ort/ort-wasm-simd-threaded.jsep.mjs
            ort/ort-wasm-simd-threaded.jsep.wasm

  # NRL-69: the SLSA generator is a REUSABLE WORKFLOW, so it has to be called
  # at job level via `jobs.<id>.uses:`. It used to be a step's `uses:`, which
  # cannot resolve a workflow path. A job with a job-level `uses:` may not carry
  # `runs-on:` or `steps:`, so both are gone; the generator works from the
  # base64 subjects alone, so the artifact download was never needed.
  #
  # The `.yml` on the end is load-bearing and is the second half of the same
  # defect. A reusable-workflow reference is `owner/repo/path/to/file.yml@ref`
  # and the extension is required; without it the ref does not resolve and the
  # whole FILE fails to compile, which is why every run in this repo's history
  # was a 0-second, 0-job failure with no log, on branch pushes that
  # `on: push: tags` should never have matched at all. Both halves were needed:
  # measured on GitHub within six minutes on 2026-09-30, the job-level call
  # without `.yml` still produced run 36677235986 (0 jobs, created_at ==
  # updated_at), removing the job entirely produced no run, and restoring it
  # with `.yml` produced no run.
  #
  # `needs: build` is kept so `needs.build.outputs.hashes` still resolves.
  # All three permissions are required by the generator's own jobs: it reads
  # workflow metadata, signs the provenance, and uploads the release asset.
  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
